<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Student Müller</title>
  <desc id="desc">Logo mit geöffnetem Buch, ausgewogener Waage und Paragraphenzeichen in Marineblau, Gold und hellem Grau.</desc>
  <defs>
