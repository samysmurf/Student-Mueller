      <stop offset="1" stop-color="#F2F5F9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8C84A"/>
      <stop offset="1" stop-color="#D99A13"/>
    </linearGradient>
  </defs>
  <rect x="38" y="38" width="948" height="948" rx="164" fill="url(#paper)" stroke="#102F55" stroke-width="25"/>
  <text x="160" y="535" font-family="Georgia,serif" font-size="570" font-weight="700" fill="#DCE3EC">§</text>
