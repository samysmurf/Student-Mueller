<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">Student Müller – Projekt-Mindmap V1.4.0</title>
<desc id="desc">Zentrale Darstellung des ChatGPT-basierten sozialrechtlichen Selbsthilfeassistenten mit den Bereichen Ziel, fachlicher Umfang, Arbeitsweise, Datenschutz, Barrierefreiheit und Qualität. Anonymisator ist als eigenständiges Schwesterprojekt dargestellt.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f8fc"/><stop offset="1" stop-color="#e8eef7"/></linearGradient>
  <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17365d"/><stop offset="1" stop-color="#274f78"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1d3557" flood-opacity=".13"/></filter>
  <style>
    text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172b45}
    .title{font-size:42px;font-weight:750;letter-spacing:.2px}
    .subtitle{font-size:21px;fill:#52657d}
    .card{fill:#fff;stroke:#d8e1ec;stroke-width:2}
    .head{font-size:24px;font-weight:750}
    .body{font-size:19px;fill:#344960}
    .small{font-size:16px;fill:#5d7087}
    .line{fill:none;stroke:#91a6bd;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .hubtitle{font-size:35px;font-weight:800;fill:#fff;letter-spacing:1px}
    .hubbody{font-size:20px;fill:#edf5ff}
    .pill{font-size:15px;font-weight:700;fill:#d9eaff;letter-spacing:1px}
  </style>
</defs>
<rect width="1600" height="1180" fill="url(#bg)"/>
<circle cx="90" cy="80" r="170" fill="#dbe8f5" opacity=".35"/>
<circle cx="1515" cy="1050" r="230" fill="#d6e5f2" opacity=".38"/>
<text x="800" y="66" text-anchor="middle" class="title">Student Müller – Projekt-Mindmap</text>
<text x="800" y="103" text-anchor="middle" class="subtitle">V1.4.0 · Verstehen. Verwalten. Selbstbestimmt handeln.</text>

<!-- Verbindungen liegen hinter den Karten -->
<path class="line" d="M625 468 C560 410 520 370 465 355"/>
<path class="line" d="M800 442 C800 360 800 320 800 282"/>
<path class="line" d="M975 468 C1040 410 1080 370 1135 355"/>
<path class="line" d="M625 620 C555 690 520 720 475 750"/>
<path class="line" d="M975 620 C1045 690 1080 720 1125 750"/>
<path class="line" d="M800 650 C800 760 800 840 800 910"/>

<!-- Ziel -->
<g filter="url(#shadow)">
  <rect class="card" x="55" y="235" width="420" height="220" rx="26"/>
  <rect x="55" y="235" width="420" height="13" rx="6" fill="#167c80"/>
  <text x="88" y="292" class="head">Ziel &amp; Leitbild</text>
  <text x="88" y="337" class="body">• kostenfrei und werbefrei</text>
  <text x="88" y="373" class="body">• Verständlichkeit und Teilhabe</text>
  <text x="88" y="409" class="body">• Selbstbestimmung im eigenen Fall</text>
</g>

<!-- Fachlicher Umfang -->
<g filter="url(#shadow)">
  <rect class="card" x="585" y="145" width="430" height="150" rx="26"/>
  <rect x="585" y="145" width="430" height="13" rx="6" fill="#3b70aa"/>
  <text x="800" y="197" text-anchor="middle" class="head">Fachlicher Umfang</text>
  <text x="800" y="235" text-anchor="middle" class="body">SGB II / XII · V / XI · IX</text>
  <text x="800" y="270" text-anchor="middle" class="body">Rente · Verwaltungsverfahren</text>
</g>

<!-- Arbeitsweise -->
<g filter="url(#shadow)">
  <rect class="card" x="1125" y="235" width="420" height="220" rx="26"/>
  <rect x="1125" y="235" width="420" height="13" rx="6" fill="#8a61b5"/>
  <text x="1158" y="292" class="head">Arbeitsweise</text>
  <text x="1158" y="337" class="body">• Tatsachen und Annahmen trennen</text>
  <text x="1158" y="373" class="body">• Quellen und Aktualität prüfen</text>
  <text x="1158" y="409" class="body">• Unsicherheit offen benennen</text>
</g>

<!-- Zentrale Einheit -->
<g filter="url(#shadow)">
  <rect x="535" y="435" width="530" height="220" rx="34" fill="url(#hub)"/>
  <text x="800" y="493" text-anchor="middle" class="pill">CHATGPT-BASIERTER ASSISTENT</text>
  <text x="800" y="550" text-anchor="middle" class="hubtitle">STUDENT MÜLLER</text>
  <text x="800" y="592" text-anchor="middle" class="hubbody">Sozialrechtliche Information &amp; Selbsthilfe</text>
  <rect x="715" y="613" width="170" height="27" rx="13" fill="#416b91"/>
  <text x="800" y="632" text-anchor="middle" class="pill">RELEASE V1.4.0</text>
</g>

<!-- Datenschutz / Grenzen -->
<g filter="url(#shadow)">
  <rect class="card" x="55" y="700" width="450" height="210" rx="26"/>
  <rect x="55" y="700" width="450" height="13" rx="6" fill="#b46a35"/>
  <text x="88" y="757" class="head">Datenschutz &amp; Grenzen</text>
  <text x="88" y="800" class="body">• externe KI-Plattform transparent</text>
  <text x="88" y="836" class="body">• keine eigene lokale OCR-Funktion</text>
  <text x="88" y="872" class="body">• keine Vertretung oder Garantie</text>
</g>

<!-- Barrierefreiheit / Qualität -->
<g filter="url(#shadow)">
  <rect class="card" x="1095" y="700" width="450" height="210" rx="26"/>
  <rect x="1095" y="700" width="450" height="13" rx="6" fill="#3a8b5b"/>
  <text x="1128" y="757" class="head">Barrierearmut &amp; Qualität</text>
  <text x="1128" y="800" class="body">• verständliche, lineare Ausgaben</text>
  <text x="1128" y="836" class="body">• Screenreader mitdenken</text>
  <text x="1128" y="872" class="body">• Tests statt Konformitätsbehauptung</text>
</g>

<!-- Schwesterprojekt -->
<g filter="url(#shadow)">
  <rect x="555" y="910" width="490" height="190" rx="28" fill="#fff" stroke="#b8c9db" stroke-width="2"/>
  <rect x="555" y="910" width="490" height="13" rx="6" fill="#536b82"/>
  <text x="800" y="960" text-anchor="middle" class="head">Eigenständiges Schwesterprojekt</text>
  <text x="800" y="1001" text-anchor="middle" class="head" fill="#244c70">ANONYMISATOR</text>
  <text x="800" y="1040" text-anchor="middle" class="body">Lokale Android-Dokumentenverarbeitung</text>
  <text x="800" y="1075" text-anchor="middle" class="small">Eigenes Repository · keine direkte KI-Verbindung</text>
</g>

<text x="800" y="1148" text-anchor="middle" class="small">Grundlagen und dokumentierte Vorarbeiten sind nicht mit fertig implementierten Funktionen gleichzusetzen.</text>
</svg>